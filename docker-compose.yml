services:
  postgres:
    image: postgres:16-alpine
    container_name: luabyte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: production_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d production_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luabyte-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/production_db"
      DATABASE_MAX_CONNECTIONS: "20"
      DATABASE_MIN_CONNECTIONS: "5"
      DATABASE_ACQUIRE_TIMEOUT_SECS: "3"
      REQUEST_TIMEOUT_SECS: "10"
      RUST_LOG: "info,axum_production_template=debug,tower_http=info"

volumes:
  postgres_data:
